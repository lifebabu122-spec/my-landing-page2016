<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Call Now</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #075e54, #128c7e);
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 35px 25px;
      text-align: center;
      background: white;
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .icon {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #25d366;
      color: white;
      font-size: 45px;
    }

    h1 {
      margin: 0 0 12px;
      color: #075e54;
      font-size: 32px;
    }

    p {
      margin: 0 0 28px;
      color: #555;
      font-size: 17px;
      line-height: 1.5;
    }

    .call-btn {
      display: block;
      width: 100%;
      padding: 17px;
      border-radius: 14px;
      background: #25d366;
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 7px 18px rgba(37,211,102,0.35);
    }

    .call-btn:active {
      transform: scale(0.98);
    }

    .note {
      margin-top: 22px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icon">☎</div>

    <h1>WhatsApp Call Now</h1>

    <p>
      Want to contact us?<br>
      Tap the button below to start a WhatsApp call.
    </p>

    <!--https://harryinspectionlucy.com/iar5i2wt4?key=b356abc17f92b2afddd282737e379fff-->
    <a
      class="call-btn"
      href="https://harryinspectionlucy.com/iar5i2wt4?key=b356abc17f92b2afddd282737e379fff
      target="_blank"
      rel="noopener">
      ☎ Call Now on WhatsApp
    </a>

    <div class="note">
      WhatsApp will open on your device.
    </div>

  </div>

</body>
</html>
